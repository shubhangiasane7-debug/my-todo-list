<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter your task..." maxlength="200" required>
            <button type="submit" class="add-btn">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>

        <p id="task-count">0 tasks remaining</p>
        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>
</body>

</html>
